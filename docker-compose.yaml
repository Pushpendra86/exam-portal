services:
  backend:
    container_name: backend-app
    image: backend-app:1.0
    environment:
      - NODE_ENV=docker
    build:
      context: backend
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=exam_portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_portal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8080:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      postgres:
        condition: service_healthy

  
  frontend:
    container_name: frontend-app
    image: frontend-app:1.0
    environment:
      - NODE_ENV=docker
      - REACT_APP_API_BASE_URL=http://backend:5000
      
    build: 
      context: frontend
      dockerfile: Dockerfile
    ports:
     - 3100:3000
    depends_on:
     - backend

  user-frontend:
    container_name: user-frontend-app
    image: user-frontend-app:1.0
    environment:
      - NODE_ENV=docker
      - REACT_APP_API_BASE_URL=http://backend:5000
    build:
      context: user-portal-frontend
      dockerfile: Dockerfile

    ports:

      - 3200:3000


    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
    driver: local